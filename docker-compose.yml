services:
  # ── FastAPI Backend ──
  backend:
    build: ./backend
    container_name: pumpboard-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/developers')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js Frontend ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: pumpboard-web
    restart: unless-stopped
    environment:
      # Server-side rendering fetches the API through the docker network
      API_URL_INTERNAL: http://backend:8000
      # Must match VISIT_SECRET in backend/.env if set there
      VISIT_SECRET: ${VISIT_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Outreach Bot (Telegram, team outreach coordination) ──
  outreach-bot:
    build: ./outreach-bot
    container_name: outreach-bot
    restart: unless-stopped
    env_file:
      - ./outreach-bot/.env
    volumes:
      - ./outreach-bot/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy Reverse Proxy (auto-HTTPS) ──
  caddy:
    image: caddy:2-alpine
    container_name: pumpboard-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
